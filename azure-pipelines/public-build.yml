# This build is used for public PR and CI builds.

trigger:
  batch: true
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

schedules:
  - cron: "30 10 * * *"
    displayName: Nightly build
    always: true
    branches:
      include:
        - main

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc-public
      image: 1es-windows-2022
      os: windows
      
    sdl:
      codeql:
        compiled:
          enabled: true
        runSourceLanguagesInSourceAnalysis: true

    settings:
      # PR's from forks do not have sufficient permissions to set tags.
      skipBuildTagsForGitHubPullRequests: ${{ variables['System.PullRequest.IsFork'] }}

    stages:
      - stage: Build
        jobs:
          - job: Build
            strategy:
              matrix:
                NODE18:
                  NODE_VERSION: "18.x"
                NODE20:
                  NODE_VERSION: "20.x"
                NODE22:
                  NODE_VERSION: "22.x"
            steps:
              - task: NodeTool@0
                inputs:
                  versionSpec: $(NODE_VERSION)
                displayName: "Install Node.js"

              # Keep authenticated feed configuration outside the customer-facing sample directories.
              - pwsh: |
                  $npmrcPath = Join-Path '$(Agent.TempDirectory)' 'cfs.npmrc'
                  @(
                    'registry=https://pkgs.dev.azure.com/azfunc/public/_packaging/upstream-public/npm/registry/'
                    '@azure:registry=https://pkgs.dev.azure.com/azfunc/public/_packaging/upstream-public/npm/registry/'
                    '@fastify:registry=https://pkgs.dev.azure.com/azfunc/public/_packaging/upstream-public/npm/registry/'
                    '@grpc:registry=https://pkgs.dev.azure.com/azfunc/public/_packaging/upstream-public/npm/registry/'
                    '@js-sdsl:registry=https://pkgs.dev.azure.com/azfunc/public/_packaging/upstream-public/npm/registry/'
                    '@opentelemetry:registry=https://pkgs.dev.azure.com/azfunc/public/_packaging/upstream-public/npm/registry/'
                    '@protobufjs:registry=https://pkgs.dev.azure.com/azfunc/public/_packaging/upstream-public/npm/registry/'
                    '@types:registry=https://pkgs.dev.azure.com/azfunc/public/_packaging/upstream-public/npm/registry/'
                  ) | Set-Content -LiteralPath $npmrcPath -Encoding ascii
                  Write-Host "##vso[task.setvariable variable=CFS_NPMRC]$npmrcPath"
                displayName: "Configure Central Feed Service"

              - task: npmAuthenticate@0
                inputs:
                  workingFile: "$(CFS_NPMRC)"
                displayName: "Authenticate npm"

              - script: npm ci
                displayName: "npm ci (ts)"
                workingDirectory: "ts"
                env:
                  NPM_CONFIG_USERCONFIG: "$(CFS_NPMRC)"
              - script: npm run build
                displayName: "npm run build (ts)"
                workingDirectory: "ts"
                env:
                  NPM_CONFIG_USERCONFIG: "$(CFS_NPMRC)"
              - script: npm run lint
                displayName: "npm run lint (ts)"
                workingDirectory: "ts"
                env:
                  NPM_CONFIG_USERCONFIG: "$(CFS_NPMRC)"
              - script: npm ci
                displayName: "npm ci (js)"
                workingDirectory: "js"
                env:
                  NPM_CONFIG_USERCONFIG: "$(CFS_NPMRC)"
              - script: npm run lint
                displayName: "npm run lint (js)"
                workingDirectory: "js"
                env:
                  NPM_CONFIG_USERCONFIG: "$(CFS_NPMRC)"
